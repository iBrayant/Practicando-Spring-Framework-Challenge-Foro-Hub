# Pruebas: H2 en memoria con compatibilidad MySQL y los datos de prueba de db/dev
spring.datasource.url=jdbc:h2:mem:foro;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration,classpath:db/dev

api.security.secret=clave-solo-para-pruebas-0123456789
api.security.issuer=API Foro Alura
