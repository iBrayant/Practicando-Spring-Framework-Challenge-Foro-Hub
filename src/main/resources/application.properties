# Base de datos (la contraseña no tiene valor por defecto: se define con DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foro_alura}
spring.datasource.username=${DB_USER:alura}
spring.datasource.password=${DB_PASSWORD}

# JPA: el esquema lo gestiona Flyway, Hibernate no lo modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway: solo las migraciones del esquema. Los datos de prueba están en el perfil "dev"
spring.flyway.locations=classpath:db/migration

# JWT (sin valor por defecto: la aplicación no arranca si falta JWT_SECRET)
api.security.secret=${JWT_SECRET}
api.security.issuer=API Foro Alura

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.filter=true

# Logging
logging.level.root=INFO
